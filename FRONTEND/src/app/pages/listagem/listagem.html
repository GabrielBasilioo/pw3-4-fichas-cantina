<h1>Fichas da Cantina</h1>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Nome</th>
      <th>Matrícula</th>
      <th>Saldo</th>
      <th>Status</th>
      <th>Ações</th>
    </tr>
  </thead>
  <tbody>
    @for (c of carteirinhas(); track c.id) {
      <tr>
        <td>{{ c.id }}</td>
        <td>{{ c.nome }}</td>
        <td>{{ c.matricula }}</td>
        <td>{{ c.saldo }}</td>
        <td>{{ c.status }}</td>
        <td>
          <button (click)="debitar(c)">Debitar</button>
          <button (click)="recarregar(c)">Recarregar</button>
          @if (c.status === 'ATIVA') {
            <button (click)="bloquear(c)">Bloquear</button>
          } @else {
            <button (click)="desbloquear(c)">Desbloquear</button>
          }
          <button (click)="excluir(c)">Excluir</button>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="6">Nenhuma carteirinha cadastrada.</td>
      </tr>
    }
  </tbody>
</table>
